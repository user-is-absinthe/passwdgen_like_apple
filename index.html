<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple-like password generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔐 Генератор паролей</h1>
        
        <div class="controls">
            <div class="field">
                <label for="length">Длина (без тире)</label>
                <input type="number" id="length" value="12" min="1" max="128">
            </div>
            
            <div class="field">
                <label for="groups">Количество групп</label>
                <input type="number" id="groups" value="3" min="1" max="64">
            </div>
            
            <div class="field">
                <label class="check">
                    <input type="checkbox" id="excludeAmbiguous" checked>
                    Исключать двусмысленные
                </label>
            </div>
            
            <div class="field">
                <label class="check">
                    <input type="checkbox" id="includeSpecials">
                    Добавить спецсимволы
                </label>
            </div>
            
            <div class="field">
                <label class="check">
                    <input type="checkbox" id="requireUppercase">
                    Обязательная заглавная
                </label>
            </div>
            
            <div class="field">
                <label class="check">
                    <input type="checkbox" id="requireDigit">
                    Обязательная цифра
                </label>
            </div>
        </div>
        
        <div class="password-output" id="passwordOutput">— — —</div>
        
        <div class="actions">
            <button class="primary-btn" id="generateBtn">Сгенерировать и скопировать</button>
            <button class="secondary-btn" id="copyBtn">Копировать</button>
        </div>
        
        <div class="credits">
            Apple-like Password Generator
        </div>
    </div>
    
    <script src="generator.js"></script>
</body>
</html>
